<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mobile Payment - Processing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f7fa;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 400px;
        }
        .spinner {
            border: 4px solid #e8e8e8;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-icon { color: #2ecc71; font-size: 48px; }
        .error-icon { color: #e74c3c; font-size: 48px; }
        h2 { margin: 15px 0 10px; }
        p { color: #666; }
        .redirect-msg { font-size: 0.85em; color: #999; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="processing" style="display: block;">
            <div class="spinner"></div>
            <h2>Processing Payment</h2>
            <p>Please wait while we confirm your payment...</p>
        </div>
        <div id="success" style="display: none;">
            <div class="success-icon">&#10004;</div>
            <h2>Payment Successful!</h2>
            <p>Your payment has been confirmed.</p>
            <p class="redirect-msg">Redirecting you back...</p>
        </div>
        <div id="error" style="display: none;">
            <div class="error-icon">&#10008;</div>
            <h2>Payment Failed</h2>
            <p id="error-message">The payment could not be processed.</p>
            <p class="redirect-msg">Redirecting you back...</p>
        </div>
    </div>

    <script>
        // Auto-redirect after 3 seconds
        setTimeout(function() {
            var returnUrl = new URLSearchParams(window.location.search).get('return_url');
            if (returnUrl) {
                window.location.href = returnUrl;
            } else {
                window.location.href = '/app/sales-invoice';
            }
        }, 3000);
    </script>
</body>
</html>
