<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Failed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec 0%, #fff3e0 100%);
            padding: 20px;
        }
        .card {
            text-align: center;
            padding: 48px 40px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 440px;
            width: 100%;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fce4ec;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon-circle svg {
            width: 40px;
            height: 40px;
            color: #c62828;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #b71c1c;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #555;
            margin-bottom: 28px;
        }
        .error-box {
            background: #fff8f8;
            border: 1px solid #fce4ec;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 28px;
            text-align: left;
        }
        .error-box .error-title {
            font-size: 13px;
            font-weight: 600;
            color: #c62828;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .error-box .error-msg {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
        .details {
            background: #f9fafb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 28px;
            text-align: left;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #888; }
        .detail-value { color: #333; font-weight: 600; }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #c62828;
            color: #fff;
        }
        .btn-primary:hover { background: #b71c1c; }
        .btn-secondary {
            background: transparent;
            color: #555;
            margin-left: 12px;
        }
        .btn-secondary:hover { color: #333; text-decoration: underline; }
        .btn-row { margin-top: 8px; }
        .help-note {
            margin-top: 24px;
            font-size: 13px;
            color: #999;
            line-height: 1.5;
        }
        /* Shake animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .icon-circle { animation: shake 0.5s ease-out; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </div>

        <h1>Payment Failed</h1>
        <p class="subtitle">Your payment could not be processed.</p>

        <div class="error-box" id="error-box" style="display:none;">
            <div class="error-title">What happened</div>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div class="details" id="details" style="display:none;">
            <div class="detail-row" id="row-invoice" style="display:none;">
                <span class="detail-label">Invoice</span>
                <span class="detail-value" id="val-invoice"></span>
            </div>
            <div class="detail-row" id="row-amount" style="display:none;">
                <span class="detail-label">Amount</span>
                <span class="detail-value" id="val-amount"></span>
            </div>
            <div class="detail-row" id="row-provider" style="display:none;">
                <span class="detail-label">Provider</span>
                <span class="detail-value" id="val-provider"></span>
            </div>
            <div class="detail-row" id="row-status" style="display:none;">
                <span class="detail-label">Status</span>
                <span class="detail-value" id="val-status"></span>
            </div>
        </div>

        <div class="btn-row">
            <a class="btn btn-primary" id="btn-retry" href="/app/sales-invoice">Try Again</a>
            <a class="btn btn-secondary" href="/app">Go to Dashboard</a>
        </div>

        <p class="help-note">
            If the amount was deducted from your account, it will be refunded automatically.<br>
            Contact support if the issue persists.
        </p>
    </div>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var invoice = params.get('invoice');
            var amount = params.get('amount');
            var currency = params.get('currency') || 'USD';
            var provider = params.get('provider');
            var reason = params.get('reason');
            var status = params.get('status');
            var hasDetails = false;

            // Error reason mapping for user-friendly messages
            var reasonMap = {
                'declined': 'The payment was declined by your mobile money provider. Please check your balance and try again.',
                'cancelled': 'You cancelled the payment. No amount has been deducted from your account.',
                'timeout': 'The payment request timed out. Please try again.',
                'insufficient_funds': 'Insufficient balance in your mobile money account.',
                'invalid_pin': 'The PIN entered was incorrect. Please try again.',
                'server_error': 'A temporary server error occurred. Please try again in a few minutes.',
                'failed': 'The transaction could not be completed. Please try again or use a different payment method.',
                'no_log': 'We could not find a matching transaction record. If you were charged, please contact support.',
                'processing_error': 'An error occurred while processing your payment. Please contact support if you were charged.'
            };

            // Show error reason
            if (reason) {
                var msg = reasonMap[reason.toLowerCase()] || reason;
                document.getElementById('error-msg').textContent = msg;
                document.getElementById('error-box').style.display = 'block';
            }

            function show(id, val) {
                if (val) {
                    document.getElementById('row-' + id).style.display = 'flex';
                    document.getElementById('val-' + id).textContent = val;
                    hasDetails = true;
                }
            }

            show('invoice', invoice);
            show('amount', amount ? ('$' + parseFloat(amount).toFixed(2) + ' ' + currency) : '');
            show('provider', provider);
            show('status', status);

            if (hasDetails) {
                document.getElementById('details').style.display = 'block';
            }

            if (invoice) {
                var btn = document.getElementById('btn-retry');
                btn.href = '/app/sales-invoice/' + encodeURIComponent(invoice);
                btn.textContent = 'Return to Invoice';
            }
        })();
    </script>
</body>
</html>
