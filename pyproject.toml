[project]
name = "mobile_payments"
version = "1.0.0"
description = "ERPNext Mobile Payment Gateway Integration (WaafiPay & Edahab)"
authors = [
    {name = "Mobile Payments Team", email = "dev@mobilepayments.so"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
readme = "README.md"
dependencies = [
    "pycryptodome>=3.9.0",
    "requests>=2.25.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0"
erpnext = ">=14.0.0"
